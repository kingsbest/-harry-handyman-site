[build]
  publish = "."

# Static HTML site — no build step needed.
# The contact form uses Netlify Forms (data-netlify="true").

# The home page is index.html, served at the bare root URL.
# It used to live at "Harry Handyman Service.dc.html", which Netlify's
# pretty-URL handling served as /harry%20handyman%20service.dc — that URL is
# indexed, so 301 every spelling of it to the root.
# The old file is still on disk as a fallback, so these need force = true to
# take precedence over it.
[[redirects]]
  from = "/Harry Handyman Service.dc.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/Harry%20Handyman%20Service.dc.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/harry handyman service.dc"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/harry%20handyman%20service.dc"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/Harry Handyman Service.dc"
  to = "/"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# London & North Kent section
# ---------------------------------------------------------------------------
# Pages live in /london/ as real files, so Netlify's pretty-URL handling serves
# london/handyman-services.html at /london/handyman-services. No rewrite needed
# for the canonical URLs — only the alias and the reserved routes below.

# Alias: /london/airbnb-services is an alternate name for the short-let content.
# The short-let vertical index is not built yet, so the alias points at the one
# short-let page that exists. Retarget to /london/short-let-services when built.
[[redirects]]
  from = "/london/airbnb-services"
  to = "/london/short-let-services/wellness-check"
  status = 301

# Reserved routes — pages that are planned but not built. These 404 cleanly
# rather than falling through to another route. Replace each with a real file
# (or delete the rule) as the page ships.
[[redirects]]
  from = "/london/renovations"
  to = "/404-london.html"
  status = 404

